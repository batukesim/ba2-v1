name: BA2 Cleanup Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout v4
        with:
          fetch-depth: 0

      - name: Remove temporary cleanup workflow
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/ba2-authorized-test-file-cleanup.yml
          git config user.name "BA2 Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary cleanup workflow"
          git push origin HEAD:main
