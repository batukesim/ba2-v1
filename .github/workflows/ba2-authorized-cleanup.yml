name: BA2 Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'RUN BA2 CLEANUP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cleanup project
        run: |
          rm -rf PROJECTS/Romantizma
          sed -i '/ROMANTIZMA-001/d' SYSTEM/PROJECT_REGISTRY.md
          rm -f .github/workflows/ba2-authorized-cleanup.yml
          git config user.name "BA2 Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delete Romantizma project"
          git push origin HEAD:main
      - name: Delete test branches
        run: |
          for b in api-test api-test-created api-test-created-2 project/romantizma-init; do
            git push origin --delete "$b" || true
          done
