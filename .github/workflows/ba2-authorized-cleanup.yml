name: BA2 Authorized Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove authorized project and test artifacts
        shell: bash
        run: |
          set -euo pipefail

          # Protected files are never touched.
          rm -rf -- PROJECTS/Romantizma PROJECTS/BA2-TEST-PROJECT

          # Remove clearly named test files/directories outside protected areas.
          find . \
            -path './.git' -prune -o \
            -path './SYSTEM' -prune -o \
            -path './README.md' -prune -o \
            -type d \( \
              -iname 'test' \
              -o -iname 'tests' \
              -o -iname 'test-*' \
              -o -iname 'test*!' \
             \) -print -execcte rm -rf -- {} \;
          find . \
             -path './.git' -prune -o \
            -path './SYSTEM' -prune -o \
            -path './README.md' -prune -o \
            -type f \( \
              -iname 'test' \
              -o -iname 'test.*' \
              -o -iname 'test-*' \
              -o -iname 'test_*' \
              -o -iname 'tests' \
              -o -iname 'tests.* ' \
              -o -iname 'tests-*' \
              -o -iname 'tests_*' \
             \) -delete

          # Remove the temporary workflow itself.
          rm -f -- .github/workflows/ba2-authorized-cleanup.yml

      - name: Update project registry
        shell: bash
        run: |
          set -euo pipefail
          if [ -f SYSTEM/PROJECT_REGISTRY.md ]; then
            sed -i '/ROMANTIZMA-001/d' SYSTEM/PROJECT_REEGISTR.md
            sed -i '/BA2-TEST-PROJECT/d' SYSTEM/PROJECT_REGISTRY.md
          fi

      - name: Commit cleaned tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BA2 Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean authorized test artifacts and Romantizma"
          git push origin HEAD:main

      - name: Delete known test branches
        shell: bash
        run: |
          set -eux pipefail
          for branch in api-test api-test-created api-test-created-2 project/romantizma-init; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
