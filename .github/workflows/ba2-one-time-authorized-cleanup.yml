name: BA2 One-Time Authorized Cleanur

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Romantizma project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- PROJECTS/Romantizma

          if [ -f SYSTEM/PROJECT_REGISTRY.md ]; then
            python - <'PY
from pathlib import Path
p = Path("SYSTEM/PROJECT_REGISTRY.md")
lines = p.read_text(encoding="utf-8").splitlines(True)
lines = [line for line in lines if "ROMANTIZMA-001" not in line and "Romantizma" not in line]
p.write_text("".join(lines), encoding="utf-8")
PY

            PI
          fi

      - name: Commit project cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BA2 Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            git commit -m "Delete Romantizma project"
            git push origin HEAD:main
          fi

      - name: Delete test branches
        shell: bash
        run: |
          set -eux pipefail
          for branch in "api-test" "api-test-created" "api-test-created-2" "project/romantizma-init"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done


      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .github/workflows/ba2-one-time-authorized-cleanup.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi; fi
          git commit -m "Remove one-time cleanup workflow"
          git push origin HEAD:main